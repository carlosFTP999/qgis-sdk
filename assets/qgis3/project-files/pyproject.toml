[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "qgis: requires QGIS Python bindings and a QGIS runtime",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["qgis.*", "osgeo.*", "processing"]
ignore_missing_imports = true
